name: "CI"
on:
  push:
  schedule:
    - cron: "0 0 * * MON-FRI"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v5
      - uses: pnpm/action-setup@5eea8caf49c844361c1e9ddc1324e179c54b58e9 # pin@v4
        with:
          version: latest
      - name: Use Node.js 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # pin@v7
        with:
          node-version: 22.x
          cache: "pnpm"
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm run puppeteer-install
          cd test && pnpm install --frozen-lockfile
      - name: Build the extension
        run: pnpm build
      - name: Run tests
        run: cd test && pnpm test
